<include src="layout.html">
  <template name="head">
    <title th:text="|分类 - ${site.title}|">分类</title>
  </template>

  <section class="hardy-list-page">
    <div th:with="hardyPageTitle='分类'">
      <include src="components/page-heading.html"></include>
    </div>

    <div
      th:if="${#lists.isEmpty(categories)}"
      th:with="hardyEmptyTitle='暂无分类',hardyEmptyDescription='整理文章后，分类会显示在这里。'"
    >
      <include src="components/empty-state.html"></include>
    </div>

    <ul class="hardy-taxonomy-list" th:unless="${#lists.isEmpty(categories)}">
      <li class="hardy-taxonomy-list__item" th:each="cat : ${categories}">
        <a class="hardy-taxonomy-list__link" th:href="@{${cat.status.permalink}}">
          <span class="hardy-taxonomy-list__name" th:text="${cat.spec.displayName}">
            Category
          </span>
          <span class="hardy-taxonomy-list__count" th:text="|${cat.postCount} 篇文章|">
            0 篇文章
          </span>
        </a>
        <p
          class="hardy-taxonomy-list__description"
          th:if="${cat.spec.description}"
          th:text="${cat.spec.description}"
        >
          Category description
        </p>
        <ul
          class="hardy-taxonomy-list hardy-taxonomy-list__children"
          th:if="${cat.children != null and !#lists.isEmpty(cat.children)}"
        >
          <li class="hardy-taxonomy-list__item" th:each="child : ${cat.children}">
            <a class="hardy-taxonomy-list__link" th:href="@{${child.status.permalink}}">
              <span class="hardy-taxonomy-list__name" th:text="${child.spec.displayName}">
                Category
              </span>
              <span class="hardy-taxonomy-list__count" th:text="|${child.postCount} 篇文章|">
                0 篇文章
              </span>
            </a>
            <p
              class="hardy-taxonomy-list__description"
              th:if="${child.spec.description}"
              th:text="${child.spec.description}"
            >
              Category description
            </p>
          </li>
        </ul>
      </li>
    </ul>
  </section>
</include>
