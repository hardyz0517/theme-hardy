    class="hardy-socials__link"

    aria-label="Email"
    title="Email"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="m3 7 9 6 9-6" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"

    target="_blank"
    rel="noopener noreferrer"

  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(hardySocial?.qq)}"

    rel="noopener noreferrer"

    title="QQ"
  >

  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(hardySocial?.wechat_qr_code)}"
    th:href="${hardySocial.wechat_qr_code}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="微信"
    title="微信"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M10 5a7 6 0 0 0-7 6c0 2 1 3.8 2.7 4.9L5 19l3.1-1.3c.6.2 1.2.3 1.9.3" />

        d="M14 9a7 6 0 0 1 7 6c0 1.8-.9 3.4-2.3 4.5l.5 2.2-3-1.3c-.7.2-1.4.3-2.2.3a7 6 0 0 1-7-6"

    </svg>

  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(hardySocial?.rss)}"
    th:href="${hardySocial.rss}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="RSS"
    title="RSS"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 4a16 16 0 0 1 16 16M4 10a10 10 0 0 1 10 10" />
      <circle cx="5" cy="19" r="1" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(hardySocial?.steam)}"
    th:href="${hardySocial.steam}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Steam"
    title="Steam"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="16.5" cy="7.5" r="3.5" />
      <circle cx="8" cy="16" r="3" />
      <path d="m10.5 14.5 3.5-4M5.3 15.5l-3-1.5" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(hardySocial?.twitter)}"
    th:href="${hardySocial.twitter}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Twitter / X"
    title="Twitter / X"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m5 4 14 16M19 4 5 20" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(hardySocial?.website ?: hardyBasic?.social_website)}"
    th:href="${hardySocial?.website ?: hardyBasic?.social_website}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="个人网站"
    title="个人网站"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M14 5h5v5M19 5l-9 9" />
      <path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4" />
    </svg>
