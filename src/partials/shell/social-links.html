<div class="hardy-socials" aria-label="社交链接" th:with="social = ${theme.config['social']}">
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(social?.email ?: theme.config.basic?.social_email)}"
    th:href="${'mailto:' + (social?.email ?: theme.config.basic.social_email)}"
    aria-label="Email"
    title="Email"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="m3 7 9 6 9-6" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(social?.github ?: theme.config.basic?.social_github)}"
    th:href="${social?.github ?: theme.config.basic.social_github}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="GitHub"
    title="GitHub"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3 0 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.3 4c.1-1.1.1-2.2-.3-3.2 0 0-1.1-.4-3.6 1.3a12.3 12.3 0 0 0-6.8 0C6.1.4 5 .8 5 .8c-.4 1-.4 2.1-.3 3.2A5.4 5.4 0 0 0 3.2 7.5c0 5.4 3.5 7 6.8 7A4.8 4.8 0 0 0 9 18v4"
      />
      <path d="M9 18c-4.5 2-5-2-7-2" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(social?.luogu)}"
    th:href="${social.luogu}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="洛谷"
    title="洛谷"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 4h14v16H5z" />
      <path d="M8 8h8M8 12h5M8 16h8" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(social?.qq)}"
    th:href="${'https://wpa.qq.com/msgrd?v=3&amp;uin=' + social.qq + '&amp;site=qq&amp;menu=yes'}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="QQ"
    title="QQ"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 4a7 7 0 0 0-7 7v2.5c0 1.4-.6 2.8-1.5 3.8l1.7.8a7.2 7.2 0 0 0 2.2 2.1c1.3.7 2.9 1 4.6 1s3.3-.3 4.6-1a7.2 7.2 0 0 0 2.2-2.1l1.7-.8c-.9-1-1.5-2.4-1.5-3.8V11a7 7 0 0 0-7-7Z"
      />
      <path d="M9 11h.01M15 11h.01M9 16c1.8 1 4.2 1 6 0" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(social?.wechat_qr_code)}"
    th:href="${social.wechat_qr_code}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="微信"
    title="微信"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M10 5a7 6 0 0 0-7 6c0 2 1 3.8 2.7 4.9L5 19l3.1-1.3c.6.2 1.2.3 1.9.3" />
      <path
        d="M14 9a7 6 0 0 1 7 6c0 1.8-.9 3.4-2.3 4.5l.5 2.2-3-1.3c-.7.2-1.4.3-2.2.3a7 6 0 0 1-7-6"
      />
      <path d="M7 11h.01M12 11h.01M14 15h.01M18 15h.01" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(social?.rss)}"
    th:href="${social.rss}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="RSS"
    title="RSS"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 4a16 16 0 0 1 16 16M4 10a10 10 0 0 1 10 10" />
      <circle cx="5" cy="19" r="1" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(social?.steam)}"
    th:href="${social.steam}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Steam"
    title="Steam"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="16.5" cy="7.5" r="3.5" />
      <circle cx="8" cy="16" r="3" />
      <path d="m10.5 14.5 3.5-4M5.3 15.5l-3-1.5" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(social?.twitter)}"
    th:href="${social.twitter}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Twitter / X"
    title="Twitter / X"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m5 4 14 16M19 4 5 20" />
    </svg>
  </a>
  <a
    class="hardy-socials__link"
    th:if="${!#strings.isEmpty(social?.website ?: theme.config.basic?.social_website)}"
    th:href="${social?.website ?: theme.config.basic.social_website}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="个人网站"
    title="个人网站"
  >
    <svg class="hardy-socials__icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M14 5h5v5M19 5l-9 9" />
      <path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4" />
    </svg>
  </a>
</div>
