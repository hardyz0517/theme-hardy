<div
  class="hardy-moment-row"
  th:with="profile = ${theme.config['profile']},momentAvatar=${moment.owner?.avatar ?: profile?.avatar ?: site.logo},momentCommentCount=${moment.stats?.approvedComment ?: moment.stats?.totalComment ?: 0}"
>
  <span class="hardy-moment-row__avatar" aria-hidden="true">
    <img
      data-hardy-media-image
      th:if="${momentAvatar}"
      th:src="${momentAvatar}"
      th:alt="${moment.owner?.displayName ?: site.title}"
      width="48"
      height="48"
      loading="lazy"
      decoding="async"
    />
    <span class="hardy-moment-row__avatar-fallback" data-hardy-media-fallback hidden>H</span>
    <span class="hardy-moment-row__avatar-fallback" th:unless="${momentAvatar}">H</span>
  </span>

  <div class="hardy-moment-row__body">
    <div
      class="hardy-moment-content hardy-prose"
      th:utext="${moment.spec?.content?.html ?: moment.spec?.content?.raw}"
    >
      Moment content
    </div>

    <div
      class="hardy-moment-media"
      th:if="${moment.spec?.content?.medium != null and !#lists.isEmpty(moment.spec.content.medium)}"
      th:classappend="|medium-${#lists.size(moment.spec.content.medium)}|"
    >
      <div class="hardy-moment-media__item" th:each="media : ${moment.spec.content.medium}">
        <a
          class="hardy-moment-media__link"
          th:if="${media.type?.toString() == 'PHOTO'}"
          th:href="${media.url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            data-hardy-media-image
            th:src="${media.url}"
            alt=""
            loading="lazy"
            decoding="async"
          />
          <span class="hardy-moment-media__fallback" data-hardy-media-fallback hidden>H</span>
        </a>
        <video
          th:if="${media.type?.toString() == 'VIDEO'}"
          class="hardy-moment-media__video"
          th:src="${media.url}"
          controls
          preload="metadata"
        ></video>
        <audio
          th:if="${media.type?.toString() == 'AUDIO'}"
          class="hardy-moment-media__audio"
          th:src="${media.url}"
          controls
          preload="metadata"
        ></audio>
        <a
          class="hardy-moment-media__post"
          th:if="${media.type?.toString() == 'POST'}"
          th:href="${media.url}"
          target="_blank"
          rel="noopener noreferrer"
          th:text="${media.url}"
          >Open link</a
        >
      </div>
    </div>

    <div class="hardy-moment-actions">
      <span class="hardy-moment-action" th:if="${moment.stats?.upvote != null}">
        <span class="hardy-moment-action__icon" aria-hidden="true">
          <svg class="hardy-icon" viewBox="0 0 24 24">
            <path
              d="M20.8 8.6c0 5.1-8.8 10.1-8.8 10.1S3.2 13.7 3.2 8.6A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.4Z"
            />
          </svg>
        </span>
        <span th:text="${moment.stats.upvote}">0</span>
      </span>

      <button
        class="hardy-moment-action hardy-moment-action--button"
        type="button"
        data-hardy-moment-comment-toggle
        aria-expanded="false"
        th:if="${haloCommentEnabled and moment?.metadata?.name != null}"
      >
        <span class="hardy-moment-action__icon" aria-hidden="true">
          <svg class="hardy-icon" viewBox="0 0 24 24">
            <path
              d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.6 8.6 0 0 1-3.7-.8L4 20l1.1-3.8A7.4 7.4 0 0 1 4.5 12 7.5 7.5 0 0 1 12 4.5a7.5 7.5 0 0 1 8 7Z"
            />
          </svg>
        </span>
        <span th:text="${momentCommentCount}">0</span>
      </button>

      <button
        class="hardy-moment-action hardy-moment-action--button"
        type="button"
        data-hardy-share
        th:attr="data-hardy-share-url=@{/moments/{name}(name=${moment.metadata.name})},data-hardy-share-title='瞬间',aria-describedby=|hardy-moment-share-status-${moment.metadata.name}|"
        aria-label="分享瞬间"
      >
        <span class="hardy-moment-action__icon" aria-hidden="true">
          <svg class="hardy-icon" viewBox="0 0 24 24">
            <path d="M14 5h5v5M19 5l-8 8M19 13v4a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4" />
          </svg>
        </span>
        <span class="hardy-visually-hidden">分享</span>
      </button>
      <span
        class="hardy-visually-hidden"
        th:id="|hardy-moment-share-status-${moment.metadata.name}|"
        aria-live="polite"
      ></span>

      <time
        class="hardy-moment-action hardy-moment-action--date"
        th:if="${moment.spec?.releaseTime}"
        th:datetime="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd')}"
        th:text="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd')}"
        >2026-01-01</time
      >
    </div>

    <div
      class="hardy-moment-comments"
      th:if="${haloCommentEnabled and moment?.metadata?.name != null}"
      hidden
    >
      <halo:comment group="moment.halo.run" kind="Moment" th:attr="name=${moment.metadata.name}" />
    </div>
  </div>
</div>
