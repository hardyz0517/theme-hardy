<include src="layout.html">
  <template name="head">
    <title th:text="|${post.spec.title} - ${site.title}|">Post Title</title>
  </template>

  <article
    class="hardy-detail"
    data-hardy-post-detail
    th:with="hardyPostEditorHref=${hardyBasic?.new_post_url ?: '/console/posts/editor'}"
  >
    <header class="hardy-detail__header">
      <p class="hardy-detail__eyebrow">文章</p>
      <h1 class="hardy-detail__title" th:text="${post.spec.title}">Post title</h1>
      <div class="hardy-detail__meta">
        <a
          class="hardy-detail__meta-item hardy-detail__meta-category"
          th:each="cat : ${post.categories}"
          th:href="@{${cat.status.permalink}}"
        >
          <svg class="hardy-detail__meta-icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.59 13.41 11 3.83A2.83 2.83 0 0 0 9 3H4v5a2.83 2.83 0 0 0 .83 2l9.58 9.59a2 2 0 0 0 2.83 0l3.35-3.35a2 2 0 0 0 0-2.83z"
            />
            <circle cx="7.5" cy="7.5" r="1" />
          </svg>
          <span th:text="${cat.spec.displayName}">Category</span>
        </a>
        <span
          class="hardy-detail__meta-item hardy-detail__meta-visits"
          th:if="${post.stats?.visit != null}"
        >
          <svg class="hardy-detail__meta-icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M2.06 12.34a1 1 0 0 1 0-.68C3.67 7.31 7.61 5 12 5s8.33 2.31 9.94 6.66a1 1 0 0 1 0 .68C20.33 16.69 16.39 19 12 19s-8.33-2.31-9.94-6.66z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span th:text="${post.stats.visit}">0</span>
        </span>
        <span
          class="hardy-detail__meta-item hardy-detail__meta-comments"
          th:if="${post.stats?.comment != null}"
        >
          <svg class="hardy-detail__meta-icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"
            />
          </svg>
          <span th:text="${post.stats.comment}">0</span>
        </span>
        <span
          class="hardy-detail__meta-item hardy-detail__meta-upvotes"
          th:if="${post.stats?.upvote != null}"
        >
          <svg class="hardy-detail__meta-icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"
            />
          </svg>
          <span th:text="${post.stats.upvote}">0</span>
        </span>
        <time
          class="hardy-detail__meta-item hardy-detail__meta-date"
          th:if="${post.spec.publishTime}"
          th:datetime="|${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}T${#temporals.format(post.spec.publishTime, 'HH:mm:ss')}|"
        >
          <svg class="hardy-detail__meta-icon hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          <span th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd HH:mm:ss')}"
            >2026-01-01 12:00:00</span
          >
        </time>
        <a
          class="hardy-detail__meta-item hardy-detail__meta-edit"
          th:if="${post.metadata?.name}"
          sec:authorize="hasRole('super-role')"
          th:href="@{${hardyPostEditorHref}(name=${post.metadata.name})}"
          aria-label="编辑文章"
          title="编辑文章"
        >
          <svg
            class="hardy-detail__meta-icon hardy-detail__meta-edit-icon hardy-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="m16.5 3.5 4 4L10 18l-4 1 1-4z" />
            <path d="m15 5 4 4" />
          </svg>
        </a>
      </div>
      <div class="hardy-detail__cover" th:if="${post.spec.cover != null and post.spec.cover != ''}">
        <img
          data-hardy-media-image
          th:src="${post.spec.cover}"
          th:alt="${post.spec.title}"
          decoding="async"
        />
        <span
          class="hardy-detail__media-fallback"
          data-hardy-media-fallback
          aria-hidden="true"
          hidden
          >H</span
        >
      </div>
    </header>

    <div class="hardy-detail__body">
      <div class="hardy-prose" data-hardy-prose th:utext="${post.content.content}"></div>
    </div>

    <footer class="hardy-detail__footer">
      <div class="hardy-detail__taxonomies" th:if="${not #lists.isEmpty(post.tags)}">
        <a
          class="hardy-detail__taxonomy"
          th:each="tag : ${post.tags}"
          th:href="@{${tag.status.permalink}}"
          th:text="${tag.spec.displayName}"
        >
          Tag
        </a>
      </div>
      <div class="hardy-detail__actions hardy-share">
        <button
          class="hardy-shell-button"
          type="button"
          data-hardy-share
          aria-describedby="hardy-share-status"
          th:attr="data-hardy-share-url=${post.status.permalink},data-hardy-share-title=${post.spec.title}"
        >
          分享
        </button>
        <span id="hardy-share-status" class="hardy-share__status" aria-live="polite"></span>
      </div>
      <nav class="hardy-post-neighbors" th:with="cursor = ${postFinder.cursor(post.metadata.name)}">
        <a
          class="hardy-post-neighbors__link"
          th:if="${cursor.hasPrevious()}"
          th:href="@{${cursor.previous.status.permalink}}"
          th:text="|上一篇：${cursor.previous.spec.title}|"
        >
          上一篇
        </a>
        <a
          class="hardy-post-neighbors__link"
          th:if="${cursor.hasNext()}"
          th:href="@{${cursor.next.status.permalink}}"
          th:text="|下一篇：${cursor.next.spec.title}|"
        >
          下一篇
        </a>
      </nav>
    </footer>
  </article>

  <section class="hardy-comments" th:if="${haloCommentEnabled}">
    <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}" />
  </section>
</include>
