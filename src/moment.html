<include src="layout.html">
  <template name="head">
    <title th:text="|瞬间 - ${site.title}|">瞬间</title>
  </template>

  <th:block th:if="${pluginFinder.available('PluginMoments')}">
    <article class="hardy-detail hardy-moment-detail">
      <header class="hardy-moments-heading hardy-moment-detail__heading">
        <h1 class="hardy-moments-heading__title">
          <svg
            class="hardy-moments-heading__icon hardy-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M4 7.5A2.5 2.5 0 0 1 6.5 5h2l1.2-2h4.6l1.2 2h2A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Z"
            />
            <circle cx="12" cy="12" r="3.25" />
          </svg>
          <span>瞬间</span>
        </h1>
        <a class="hardy-moments-heading__rss" th:href="@{/moments}" aria-label="返回瞬间列表"
          >返回列表</a
        >
      </header>
      <div class="hardy-moment-card hardy-moment-card--detail" th:with="hardyMomentDetail=true">
        <include src="components/moment-item.html"></include>
      </div>
      <section
        id="hardy-moment-comments"
        class="hardy-moment-comments"
        th:if="${haloCommentEnabled and moment?.metadata?.name != null}"
      >
        <halo:comment
          group="moment.halo.run"
          kind="Moment"
          th:attr="name=${moment.metadata.name}"
        />
      </section>
    </article>
  </th:block>
</include>
