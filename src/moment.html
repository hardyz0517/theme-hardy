<include src="layout.html">
  <template name="head">
    <title th:text="|瞬间 - ${site.title}|">瞬间</title>
  </template>

  <th:block th:if="${pluginFinder.available('PluginMoments')}">
    <article class="hardy-detail hardy-moment-detail">
      <header class="hardy-detail__header">
        <p class="hardy-detail__eyebrow">瞬间</p>
        <h1 class="hardy-detail__title">瞬间</h1>
        <div class="hardy-detail__meta">
          <time
            th:if="${moment.spec?.releaseTime}"
            th:datetime="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd')}"
            th:text="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd')}"
            >2026-01-01</time
          >
        </div>
      </header>

      <div class="hardy-prose" th:utext="${moment.spec.content.html ?: moment.spec.content.raw}">
        瞬间内容
      </div>

      <footer class="hardy-detail__footer">
        <div
          class="hardy-detail__taxonomies"
          th:if="${moment.spec?.tags != null and !#lists.isEmpty(moment.spec.tags)}"
        >
          <a
            class="hardy-detail__taxonomy"
            th:each="tag : ${moment.spec.tags}"
            th:href="@{/moments(tag=${tag.name})}"
            th:text="${tag.displayName ?: tag.name}"
            >标签</a
          >
        </div>
      </footer>
    </article>

    <section
      class="hardy-comments"
      th:if="${haloCommentEnabled and moment?.metadata?.name != null}"
    >
      <halo:comment group="moment.halo.run" kind="Moment" th:attr="name=${moment.metadata.name}" />
    </section>
  </th:block>
</include>
