<include src="layout.html">
  <template name="head">
    <title th:text="|${site.title} - 瞬间|">瞬间</title>
  </template>

  <th:block th:if="${pluginFinder.available('PluginMoments')}">
    <section class="hardy-list-page hardy-moments-page">
      <div th:with="hardyPageEyebrow='瞬间',hardyPageTitle='瞬间'">
        <include src="components/page-heading.html"></include>
      </div>

      <nav
        class="hardy-moments-tags"
        aria-label="Moment tags"
        th:if="${tags != null and !#lists.isEmpty(tags)}"
      >
        <a class="hardy-moments-tags__link" th:href="@{/moments}">All</a>
        <a
          class="hardy-moments-tags__link"
          th:each="tag : ${tags}"
          th:href="@{/moments(tag=${tag.name})}"
          th:text="${tag.displayName ?: tag.name}"
          >Tag</a
        >
      </nav>

      <div
        th:if="${moments == null or #lists.isEmpty(moments.items)}"
        th:with="hardyEmptyTitle='暂无瞬间',hardyEmptyDescription='发布后的瞬间会显示在这里。'"
      >
        <include src="components/empty-state.html"></include>
      </div>

      <div class="hardy-moments-list" th:if="${moments != null and !#lists.isEmpty(moments.items)}">
        <article class="hardy-moment-card" th:each="moment : ${moments.items}">
          <header class="hardy-moment-card__header">
            <time
              th:if="${moment.spec?.releaseTime}"
              th:datetime="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd')}"
              th:text="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd')}"
              >2026-01-01</time
            >
            <a
              class="hardy-moment-card__permalink"
              th:href="@{/moments/{name}(name=${moment.metadata.name})}"
              aria-label="查看瞬间"
              >查看</a
            >
          </header>
          <div
            class="hardy-prose hardy-moment-card__content"
            th:utext="${moment.spec.content.html ?: moment.spec.content.raw}"
          >
            Moment content
          </div>
          <footer class="hardy-moment-card__footer">
            <div
              class="hardy-moment-card__tags"
              th:if="${moment.spec?.tags != null and !#lists.isEmpty(moment.spec.tags)}"
            >
              <a
                class="hardy-detail__taxonomy"
                th:each="tag : ${moment.spec.tags}"
                th:href="@{/moments(tag=${tag.name})}"
                th:text="${tag.displayName ?: tag.name}"
                >Tag</a
              >
            </div>
            <div class="hardy-moment-card__stats">
              <span
                th:if="${moment.stats?.upvote != null}"
                th:text="|${moment.stats.upvote} 次点赞|"
                >0 次点赞</span
              >
              <span
                th:if="${moment.stats?.approvedComment != null}"
                th:text="|${moment.stats.approvedComment} 条评论|"
                >0 条评论</span
              >
            </div>
          </footer>
        </article>
      </div>

      <div th:with="hardyPagination=${moments}">
        <include src="components/pagination.html"></include>
      </div>
    </section>
  </th:block>
</include>
