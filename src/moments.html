<include src="layout.html">
  <template name="head">
    <title th:text="|瞬间 - ${site.title}|">瞬间</title>
  </template>

  <th:block th:if="${pluginFinder.available('PluginMoments')}">
    <section class="hardy-list-page hardy-moments-page">
      <header class="hardy-moments-heading">
        <h1 class="hardy-moments-heading__title">
          <svg
            class="hardy-moments-heading__icon hardy-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M4 7.5A2.5 2.5 0 0 1 6.5 5h2l1.2-2h4.6l1.2 2h2A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Z"
            />
            <circle cx="12" cy="12" r="3.25" />
          </svg>
          <span>瞬间</span>
        </h1>
        <a
          class="hardy-moments-heading__rss"
          th:href="@{/feed/moments/rss.xml}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="hardy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19.5a1.5 1.5 0 1 0 0 .01M5 12a7 7 0 0 1 7 7M5 5a14 14 0 0 1 14 14" />
          </svg>
          <span>RSS 订阅</span>
        </a>
      </header>

      <nav
        class="hardy-moments-tags"
        aria-label="瞬间标签"
        th:if="${tags != null and !#lists.isEmpty(tags)}"
      >
        <a class="hardy-moments-tags__link is-active" th:href="@{/moments}">
          <span>全部</span>
        </a>
        <a
          class="hardy-moments-tags__link"
          th:each="tag : ${tags}"
          th:href="@{/moments(tag=${tag.name})}"
        >
          <span th:text="${tag.name}">Tag</span>
          <span class="hardy-moments-tags__count" th:text="${tag.momentCount ?: 0}">0</span>
        </a>
      </nav>

      <div
        th:if="${moments == null or #lists.isEmpty(moments.items)}"
        th:with="hardyEmptyTitle='暂无瞬间',hardyEmptyDescription='发布后的瞬间会显示在这里。'"
      >
        <include src="components/empty-state.html"></include>
      </div>

      <ul
        class="hardy-moments-list"
        role="list"
        th:if="${moments != null and !#lists.isEmpty(moments.items)}"
      >
        <li class="hardy-moment-card" th:each="moment : ${moments.items}">
          <include src="components/moment-item.html"></include>
        </li>
      </ul>

      <div th:with="hardyPagination=${moments}">
        <include src="components/pagination.html"></include>
      </div>
    </section>
  </th:block>
</include>
